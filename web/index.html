<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Browser</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1 id="project-name">Project Browser</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
    </div>
    <div class="controls">
      <label class="field">
        <span>Find</span>
        <input id="filter" type="search" placeholder="SH05, prop_…" autocomplete="off">
      </label>
      <label class="field">
        <span>You</span>
        <input id="user" type="text" autocomplete="nickname" spellcheck="false">
      </label>
      <button id="refresh" class="button" type="button" title="Rescan the project folder">Refresh</button>
    </div>
  </header>

  <nav id="legend" class="legend" aria-label="Show only tasks with these statuses"></nav>

  <main id="main">
    <p class="empty">Loading…</p>
  </main>

  <aside id="panel" class="panel" aria-labelledby="panel-title" hidden>
    <header class="panel-head">
      <img id="panel-thumb" class="panel-thumb" alt="" hidden>
      <div>
        <h2 id="panel-title"></h2>
        <p id="panel-context" class="muted"></p>
      </div>
      <button id="panel-close" class="icon-button" type="button" aria-label="Close">✕</button>
    </header>

    <div id="task-tabs" class="task-tabs" role="tablist" aria-label="Tasks"></div>

    <section class="panel-section" aria-labelledby="form-title">
      <h3 id="form-title">Update</h3>
      <form id="task-form" class="task-form">
        <label class="field">
          <span>Status</span>
          <select id="form-status"></select>
        </label>
        <label class="field">
          <span>Assignee</span>
          <input id="form-assignee" type="text" list="people" autocomplete="off" spellcheck="false">
        </label>
        <label class="field wide">
          <span>Comment</span>
          <textarea id="form-comment" rows="3" placeholder="Feedback, what changed, what's next… (Ctrl+Enter saves)"></textarea>
        </label>
        <button id="form-save" class="button primary" type="submit">Save</button>
      </form>
      <datalist id="people"></datalist>
    </section>

    <section class="panel-section" aria-labelledby="notes-title">
      <h3 id="notes-title">Notes</h3>
      <ol id="notes" class="notes"></ol>
    </section>

    <section class="panel-section" aria-labelledby="versions-title">
      <h3 id="versions-title">Versions</h3>
      <div id="versions"></div>
    </section>
  </aside>

  <dialog id="viewer" class="viewer" aria-label="Preview">
    <div class="viewer-bar">
      <span id="viewer-title"></span>
      <button id="viewer-close" class="icon-button" type="button" aria-label="Close preview">✕</button>
    </div>
    <div id="viewer-body" class="viewer-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
