# Project config for the TUP File Sorter.
#
# Lives at <project root>/_pipeline/project.toml. The sorter refuses to run on
# a folder without one, so it can never sort the wrong folder by accident.
# Create one with:  python main.py --root /path/to/project --init

[project]
name = "The Ugly Princess"
code = "TUP"
# Production folder, relative to the project root ("." if there isn't one).
production = "production"


[ignore]
# Folders (any depth) whose contents are never touched. Case-insensitive.
dirs = [
    ".git", "__pycache__", ".idea", ".vscode", ".vs", ".history", "node_modules",
    ".pytest_cache", ".mypy_cache", ".ruff_cache",
    "temp", "tmp", "cache", "backup", "backups", "archive", "old",
    "autosave", "render_temp",
]
# Files whose name contains any of these are skipped (temp and sync files).
name_parts = [
    ".tmp", ".part", ".partial", ".download", ".crdownload", ".onedrive",
    ".tmp.drivedownload", ".sync", ".cloud", ".onecache", ".!sync",
    ".autosave", ".bkp", ".backup", ".ds_store", "thumbs.db", "desktop.ini",
]
# Files and folders starting with these are skipped. Keep "_": it is the
# team's "do not sort" marker.
prefixes = [".", "~", "_"]


# Named extension lists. Rules can use a group name in `ext` instead of
# listing extensions.
[file_groups]
model = [".ma", ".mb", ".fbx", ".obj", ".blend"]
texture = [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".exr", ".tga"]
image = [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".exr", ".tga"]
video = [".mov", ".mp4", ".avi", ".mkv"]
audio = [".mp3", ".wav", ".aif", ".aiff"]
edit_session = [".sesx", ".prproj", ".fcpxml", ".logicx", ".band", ".ptx"]
comp = [".aep", ".aepx", ".nk", ".nknc"]


# Shot structure. Any rule whose pattern captures a `shot` field can use
# {shot_dir}, {act}, {sequence} and {scene} in its dest.
[shots]
# Folder for shots listed in the ranges below.
dir = "{production}/Acts/{act}/{sequence}/{scene}/{shot}"
# Folder for shots that aren't in any range (act/sequence/scene are "unassigned").
unmapped_dir = "{production}/shots/{shot}"
shot_format = "SH{num:02d}"
scene_format = "SC_{num:02d}"

# Each shot in a range gets its own scene, numbered from 1 within the range.
# `first` and `last` are inclusive shot numbers.
[[shots.ranges]]
act = "Act_1"
sequence = "SQ_01"
first = 1
last = 19

[[shots.ranges]]
act = "Act_2"
sequence = "SQ_02"
first = 20
last = 27

[[shots.ranges]]
act = "Act_2"
sequence = "SQ_03"
first = 28
last = 36

[[shots.ranges]]
act = "Act_3"
sequence = "SQ_04"
first = 37
last = 42

[[shots.ranges]]
act = "Act_3"
sequence = "SQ_05"
first = 43
last = 54


# Routing rules, checked top to bottom. The first match wins.
#
# A rule matches when all of its conditions hold (matching ignores case):
#   pattern   regex matched from the start of the filename. Named groups,
#             like (?P<asset>...), become fields usable in dest.
#   ext       extensions (".ma") and/or file group names ("model")
#   contains  the filename contains at least one of these
#
# dest is the destination folder, relative to the project root. Fields go in
# braces: {production}, any named group, and the shot fields above.
#
# Version tracking (python main.py --report) uses three optional keys:
#   entity       what the file belongs to, e.g. "{shot}" or "prop_{asset}"
#   entity_type  a group for the entity, e.g. "shot" or "prop"
#   task         the kind of work, e.g. "layout" or "textures"
# Rules without an entity aren't tracked. Cases inherit all three from their
# rule and can override them.
#
# A rule can have [[rules.cases]]: sub-rules checked in order, each with its
# own conditions. A case's dest is relative to the rule's dest, and a case
# without conditions catches everything else. If no case matches, the next
# rule is tried.
#
# Existing folders are reused even if their case differs (prop_oillamp vs
# prop_OilLamp), so a typo in case never splits an asset in two.

[[rules]]
name = "Shot render frames"
pattern = '(?P<shot>sh\d{2,3})_.*[_\-]\d{4,6}\.(png|tga|exr|jpg|jpeg|tif|tiff)$'
dest = "{shot_dir}/renders"
entity = "{shot}"
entity_type = "shot"
task = "renders"

[[rules]]
name = "Render frames without a shot"
pattern = 'sh\d{2,3}.*[_\-]\d{4,6}\.(png|tga|exr|jpg|jpeg|tif|tiff)$'
dest = "{production}/shots/renders"

[[rules]]
name = "Reference video"
pattern = '(ref|reference)_'
ext = [".mov", ".mp4", ".avi"]
dest = "reference"

[[rules]]
name = "Editing sessions"
ext = ["edit_session"]
dest = "editing/sessions"

[[rules]]
name = "Music"
pattern = 'music_'
ext = ["audio"]
dest = "editing/audio"

[[rules]]
name = "Concept art"
pattern = 'concept_'
dest = "concept_art"
    [[rules.cases]]
    pattern = 'concept_char_'
    dest = "characters"
    [[rules.cases]]
    pattern = 'concept_env_'
    dest = "locations"
    [[rules.cases]]
    pattern = 'concept_prop_'
    dest = "props"
    [[rules.cases]]
    pattern = 'concept_fx_'
    dest = "fx"
    [[rules.cases]]
    dest = "misc"

[[rules]]
name = "2D FX tests"
pattern = 'animfx_test_'
ext = [".mov"]
dest = "concept_art/Anim/2D/fx"

[[rules]]
name = "2D character tests"
pattern = 'animchar_test_'
ext = [".mov"]
dest = "concept_art/Anim/2D/char"

[[rules]]
name = "Characters"
pattern = 'char_(?P<asset>[^_.]+)'
dest = "{production}/assets/3d/char/char_{asset}"
entity = "char_{asset}"
entity_type = "char"
    [[rules.cases]]
    ext = ["model"]
    dest = "model"
    task = "model"
    [[rules.cases]]
    ext = ["texture"]
    dest = "textures"
    task = "textures"
    [[rules.cases]]

[[rules]]
name = "Props"
pattern = 'prop_(?P<asset>[^_.]+)'
dest = "{production}/assets/3d/props/prop_{asset}"
entity = "prop_{asset}"
entity_type = "prop"
    [[rules.cases]]
    ext = ["model"]
    dest = "model"
    task = "model"
    [[rules.cases]]
    ext = ["texture"]
    dest = "textures"
    task = "textures"
    [[rules.cases]]

[[rules]]
name = "Environments"
pattern = 'env_(?P<asset>[^_.]+)'
dest = "{production}/assets/3d/env/env_{asset}"
entity = "env_{asset}"
entity_type = "env"
    [[rules.cases]]
    ext = ["model"]
    dest = "model"
    task = "model"
    [[rules.cases]]
    ext = ["texture"]
    dest = "textures"
    task = "textures"
    [[rules.cases]]

[[rules]]
name = "Shot files"
pattern = '(?P<shot>sh\d{2,3})_'
dest = "{shot_dir}"
entity = "{shot}"
entity_type = "shot"
    [[rules.cases]]
    contains = ["layout"]
    dest = "layout"
    task = "layout"
    [[rules.cases]]
    ext = [".ma"]
    dest = "layout"
    task = "layout"
    [[rules.cases]]
    ext = [".blend", ".fbx", ".obj", ".mb"]
    dest = "3d"
    task = "3d"
    [[rules.cases]]
    ext = [".xstage", ".psd", ".png"]
    contains = ["anim"]
    dest = "2d"
    task = "2d"
    [[rules.cases]]
    contains = ["fx2d", "fx3d"]
    dest = "fx"
    task = "fx"
    [[rules.cases]]
    ext = ["comp"]
    dest = "comp"
    task = "comp"
    [[rules.cases]]
    ext = ["image"]
    dest = "renders"
    task = "renders"
    [[rules.cases]]
    contains = ["render"]
    dest = "renders"
    task = "renders"
    [[rules.cases]]


# How versions and image sequences are read from filenames (without the
# extension). The version is removed to get the name that versions are grouped
# under: SH05_layout_v003.ma and SH05_layout_v004.ma are two versions of
# SH05_layout.ma. Frame numbers become #### so a sequence is one item.
[versions]
pattern = '[_.\-]v(?P<version>\d+)(?=[_.\-]|$)'
frame_pattern = '[_.\-](?P<frame>\d{4,6})$'


# Production tracking (python main.py --status), modelled on Kitsu.
#
# Statuses are listed in workflow order. Flags:
#   default           the status every task starts at (exactly one)
#   done              the task is finished and approved
#   feedback_request  the artist is waiting for review
#   retake            review asked for changes
# label is the short text shown on status chips; name is the full name.
# Optional: color = "#rrggbb" for the project browser. Without it, a colour
# is picked from the flags. Text colour is chosen automatically for contrast.
# Changes are stored in _pipeline/events/, one file per person and machine.

[[statuses]]
code = "todo"
name = "Waiting to start"
label = "Waiting"
default = true

[[statuses]]
code = "ready"
name = "Ready to start"
label = "Ready"

[[statuses]]
code = "wip"
name = "In progress"
label = "In progress"

[[statuses]]
code = "wfa"
name = "Pending review"
label = "In review"
feedback_request = true

[[statuses]]
code = "retake"
name = "Retake (changes requested)"
label = "Retake"
retake = true

[[statuses]]
code = "done"
name = "Approved"
label = "Approved"
done = true

# The tasks each entity type goes through, in order. These match the `task`
# names in the rules, so versions and statuses line up.
[task_types]
shot = ["layout", "3d", "2d", "fx", "comp", "renders"]
char = ["model", "textures"]
prop = ["model", "textures"]
env = ["model", "textures"]

# When a task reaches a status, move another task of the same shot or asset.
# Only tasks still at the default status are moved, so an automation never
# overwrites work in progress. These are examples; change them to fit.
[[automations]]
entity_type = "shot"
task = "layout"
status = "done"
then_task = "3d"
then_status = "ready"

[[automations]]
entity_type = "shot"
task = "layout"
status = "done"
then_task = "2d"
then_status = "ready"

[[automations]]
entity_type = "shot"
task = "renders"
status = "done"
then_task = "comp"
then_status = "ready"

[[automations]]
entity_type = "prop"
task = "model"
status = "done"
then_task = "textures"
then_status = "ready"


# Statuses that keep themselves up to date from the files people save, so
# nobody has to remember to click. Remove a key to turn that part off.
[auto_status]
# A task's first file moves it out of these statuses...
start_from = ["todo", "ready"]
# ...into this one.
started = "wip"
# A new version after a retake moves the task back to work in progress.
after_retake = "wip"

# Warnings shown in the project browser and --status.
[health]
# An active task with no new file or update for this many days is "stalled".
stale_days = 7


# Files that match no rule.
[fallback]
dest = "incoming"
# Unmatched files are only moved out of these folders ("." is the project
# root). Unmatched files anywhere else are left where someone put them.
from = ["."]
